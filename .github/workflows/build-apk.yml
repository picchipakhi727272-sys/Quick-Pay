name: Build Quick Pay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Debug Keystore
        run: |
          mkdir -p "$HOME/.config/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Get SHA-1
        run: |
          ./gradlew :app:signingReport

          echo "=============================="
          echo "QUICK PAY SHA-1"
          echo "=============================="

          keytool -list -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android | grep -i "SHA1"

      - name: Build Quick Pay APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Quick Pay APK
        uses: actions/upload-artifact@v4
        with:
          name: Quick-Pay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
