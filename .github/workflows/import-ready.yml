name: Import Firebase Ready Project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Firebase Ready ZIP
        run: |
          ZIP="Quick-Pay-Firebase-Backend-Ready.zip"
          if [ -f "$ZIP" ]; then
            rm -rf /tmp/quickpay
            mkdir -p /tmp/quickpay
            unzip -o "$ZIP" -d /tmp/quickpay
            cp -R /tmp/quickpay/Quick-Pay-main/. .
            rm -f "$ZIP"
          fi

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import Firebase backend ready project"
          git push
